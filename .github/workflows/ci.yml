name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            libtool \
            libusb-1.0-0-dev \
            pkg-config

      - name: Generate autotools files
        run: ./autogen.sh

      - name: Configure
        run: ./configure

      - name: Compile
        run: make
